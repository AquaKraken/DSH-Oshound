<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
<style>
@keyframes sonar-a{0%{r:2;opacity:.7}100%{r:11;opacity:0}}
@keyframes sonar-b{0%{r:2;opacity:.5}100%{r:14;opacity:0}}
.sa{animation:sonar-a 1.1s ease-out infinite}
.sb{animation:sonar-b 1.1s .3s ease-out infinite}
</style>
