<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
<style>
@keyframes pb{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
.p1{animation:pb .65s .00s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.p2{animation:pb .65s .18s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
<rect class="p1" x="4" y="4" width="7" height="16" rx="3.5" fill="currentColor"/>
<rect class="p2" x="13" y="4" width="7" height="16" rx="3.5" fill="currentColor"/>
</svg>