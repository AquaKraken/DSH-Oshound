<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
<style>
@keyframes wave-sweep{0%{transform:translateX(-4px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes sonar-out{0%{r:6;opacity:.65}100%{r:14;opacity:0}}
.uw1{animation:wave-sweep .35s .00s ease-out forwards;opacity:1}
.uw2{animation:wave-sweep .35s .14s ease-out forwards;opacity:1}
.uso{animation:sonar-out .9s ease-out infinite}
</style>
<circle class="uso" cx="10" cy="12" r="6" fill="none" stroke="currentColor" stroke-width=".7" opacity="0"/>
<polygon points="3,8 3,16 7,16 13,20 13,4 7,8" stroke="currentColor" stroke-width="1.7"/>
<path class="uw1" d="M16 10a4 4 0 0 1 0 4"     stroke="currentColor" stroke-width="1.8"/>
<path d="M19 7a8 8 0 0 1 0 10" class="uw2"    stroke="currentColor" stroke-width="1.3" opacity=".6"/>
</svg>
